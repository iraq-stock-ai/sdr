name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت حزم المشروع
        run: npm install

      - name: بناء نسخة الويب (Vite)
        run: npx vite build

      - name: إضافة منصة أندرويد عبر Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: منح صلاحية التنفيذ لـ gradlew
        run: chmod +x android/gradlew

      - name: بناء ملف APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: رفع ملف APK كمخرج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: المستثمر-الذكي-العراقي-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
