name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت حزم المشروع
        run: npm install

      - name: بناء نسخة الويب (Vite)
        run: npx vite build

      - name: إضافة منصة أندرويد عبر Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: توليد واستبدال أيقونات التطبيق الفاخرة لكل المقاسات
        run: |
          python3 -c "
          from PIL import Image, ImageDraw
          import os

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192
          }

          def draw_calc_icon(size):
              img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              
              # خلفية دائرية كحلية فاخرة
              draw.ellipse([0, 0, size, size], fill=(15, 23, 42, 255))
              
              # جسم الحاسبة
              m = int(size * 0.18)
              draw.rounded_rectangle([m, m, size - m, size - m], radius=int(size * 0.08), fill=(30, 41, 59, 255))
              
              # شاشة الحاسبة
              s_top, s_bottom = int(size * 0.25), int(size * 0.42)
              s_left, s_right = int(size * 0.25), int(size * 0.75)
              draw.rounded_rectangle([s_left, s_top, s_right, s_bottom], radius=int(size * 0.04), fill=(15, 23, 42, 255))
              
              # سهم النمو الأخضر
              green = (16, 185, 129, 255)
              pts = [(int(size * 0.3), int(size * 0.37)), (int(size * 0.43), int(size * 0.32)), (int(size * 0.53), int(size * 0.35)), (int(size * 0.68), int(size * 0.28))]
              draw.line(pts, fill=green, width=max(2, int(size * 0.04)))
              
              # أزرار الحاسبة
              b_y = [int(size * 0.48), int(size * 0.60), int(size * 0.72)]
              b_x = [int(size * 0.26), int(size * 0.44), int(size * 0.62)]
              bw, bh = int(size * 0.12), int(size * 0.08)
              
              colors = [
                  [(56, 189, 248), (56, 189, 248), (245, 158, 11)],
                  [(148, 163, 184), (148, 163, 184), (245, 158, 11)],
                  [(148, 163, 184), (148, 163, 184), (16, 185, 129)]
              ]
              
              for r in range(3):
                  for c in range(3):
                      x, y = b_x[c], b_y[r]
                      col = colors[r][c] + (255,)
                      h = bh * 2 + int(size * 0.04) if (r == 2 and c == 2) else bh
                      draw.rounded_rectangle([x, y, x + bw, y + h], radius=int(size * 0.02), fill=col)
                      
              return img

          base_path = 'android/app/src/main/res'
          for folder, sz in sizes.items():
              folder_path = os.path.join(base_path, folder)
              os.makedirs(folder_path, exist_ok=True)
              icon_img = draw_calc_icon(sz)
              icon_img.save(os.path.join(folder_path, 'ic_launcher.png'))
              icon_img.save(os.path.join(folder_path, 'ic_launcher_round.png'))
              icon_img.save(os.path.join(folder_path, 'ic_launcher_foreground.png'))
          "

      - name: منح صلاحية التنفيذ لـ gradlew
        run: chmod +x android/gradlew

      - name: بناء ملف APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: رفع ملف APK كمخرج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: المستثمر-الذكي-العراقي-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
