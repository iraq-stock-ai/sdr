name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout الكود
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: تثبيت حزم المشروع
        run: npm install

      - name: بناء نسخة الويب (Vite)
        run: npx vite build

      - name: إضافة منصة أندرويد عبر Capacitor
        run: |
          npx cap add android
          npx cap sync android

      - name: إنشاء وتطبيق أيقونة التطبيق الأنيقة
        run: |
          mkdir -p android/app/src/main/res/drawable/
          
          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#1E293B"
                  android:pathData="M54,54m-44,0a44,44 0 1,0 88,0a44,44 0 1,0 -88,0"/>
          </vector>
          EOF

          cat << 'EOF' > android/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- هيكل الحاسبة الفاخر -->
              <path
                  android:fillColor="#1E293B"
                  android:pathData="M28,20 h52 a8,8 0 0 1 8,8 v52 a8,8 0 0 1 -8,8 h-52 a8,8 0 0 1 -8,-8 v-52 a8,8 0 0 1 8,-8 z"/>
              <!-- شاشة العرض العلوية -->
              <path
                  android:fillColor="#0F172A"
                  android:pathData="M34,26 h40 a4,4 0 0 1 4,4 v16 a4,4 0 0 1 -4,4 h-40 a4,4 0 0 1 -4,-4 v-16 a4,4 0 0 1 4,-4 z"/>
              <!-- سهم النمو الأخضر داخل الشاشة -->
              <path
                  android:fillColor="#10B981"
                  android:pathData="M38,42 L46,35 L53,38 L63,30 L63,35 L66,35 L66,27 L58,27 L58,30 L61,30 L53,36 L46,33 L37,40 z"/>
              <!-- أزرار الحاسبة الذهبية والزرقاء -->
              <path android:fillColor="#38BDF8" android:pathData="M34,54 h10 v8 h-10 z"/>
              <path android:fillColor="#38BDF8" android:pathData="M49,54 h10 v8 h-10 z"/>
              <path android:fillColor="#F59E0B" android:pathData="M64,54 h10 v8 h-10 z"/>

              <path android:fillColor="#94A3B8" android:pathData="M34,65 h10 v8 h-10 z"/>
              <path android:fillColor="#94A3B8" android:pathData="M49,65 h10 v8 h-10 z"/>
              <path android:fillColor="#F59E0B" android:pathData="M64,65 h10 v8 h-10 z"/>

              <path android:fillColor="#94A3B8" android:pathData="M34,76 h10 v8 h-10 z"/>
              <path android:fillColor="#94A3B8" android:pathData="M49,76 h10 v8 h-10 z"/>
              <path android:fillColor="#10B981" android:pathData="M64,76 h10 v19 h-10 z"/>
          </vector>
          EOF

      - name: منح صلاحية التنفيذ لـ gradlew
        run: chmod +x android/gradlew

      - name: بناء ملف APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: رفع ملف APK كمخرج (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: المستثمر-الذكي-العراقي-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
